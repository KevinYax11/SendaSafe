name: CI

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run validate:directory
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: docker build --tag sendasafe:ci .
      - run: docker run --detach --name sendasafe-ci --publish 127.0.0.1:3000:3000 sendasafe:ci
      - name: Wait for the container API
        run: curl --fail --silent --show-error --max-time 5 --retry 20 --retry-delay 2 --retry-max-time 45 --retry-all-errors http://127.0.0.1:3000/api/v1/countries --output /dev/null
      - run: node scripts/check-deployment.mjs
      - if: failure()
        run: docker logs sendasafe-ci
